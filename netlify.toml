# ============================================================
# Netlify deployment — Indah Water Collections Dashboard
#
# Connect the repo in Netlify and it picks this up automatically;
# no settings need to be filled in by hand.
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Install devDependencies too — vite lives there and is needed to build.
  NPM_FLAGS = "--include=dev"

# ------------------------------------------------------------
# SPA fallback. React Router owns /customers, /voice-ai and the
# rest; without this, a hard refresh or a shared deep link would
# 404 because no such file exists on disk.
#
# Netlify serves a matching static file first, so real assets are
# unaffected by this catch-all.
# ------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------
# Headers
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # config.js is bundled into the client, so the deployed JS contains a
    # live Vapi secret key. Keep the site out of search indexes.
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints asset filenames, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell must never be cached, or a deploy would keep serving
# the old bundle references.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
